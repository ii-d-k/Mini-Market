<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito · MiniMarket</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4 py-lg-5">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <h1 class="h3 fw-bold mb-0"><i class="bi bi-cart3 text-success me-2"></i>Tu carrito</h1>
      <a href="/" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left me-1"></i>Seguir comprando</a>
    </div>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="tarjeta">
          <div id="items"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="tarjeta p-4 resumen-pedido">
          <h2 class="h5 fw-bold mb-3">Resumen del pedido</h2>
          <div class="d-flex justify-content-between mb-1 text-secondary">
            <span>Productos (<span id="unidades">0</span>)</span><span id="subtotal">₡0</span>
          </div>
          <div class="d-flex justify-content-between mb-3 text-secondary">
            <span>Envío</span><span class="text-success fw-semibold">Gratis</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between align-items-center mb-4">
            <span class="fw-bold">Total</span><span id="total" class="fs-4 fw-bold">₡0</span>
          </div>

          <form id="checkout" novalidate>
            <h3 class="h6 fw-bold mb-3">Datos de entrega</h3>
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input id="nombre" name="nombre" class="form-control" required minlength="2" maxlength="120" autocomplete="name">
              <div class="invalid-feedback">Escribe tu nombre.</div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-sm-7">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" required maxlength="120" autocomplete="email">
                <div class="invalid-feedback">Escribe un email válido.</div>
              </div>
              <div class="col-sm-5">
                <label for="telefono" class="form-label">Teléfono</label>
                <input id="telefono" name="telefono" class="form-control" required maxlength="30" autocomplete="tel">
                <div class="invalid-feedback">Escribe tu teléfono.</div>
              </div>
            </div>
            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección de entrega</label>
              <input id="direccion" name="direccion" class="form-control" required maxlength="250" autocomplete="street-address">
              <div class="invalid-feedback">Escribe la dirección.</div>
            </div>
            <div class="mb-4">
              <label for="notas" class="form-label">Notas <span class="text-secondary">(opcional)</span></label>
              <textarea id="notas" name="notas" class="form-control" rows="2" maxlength="500" placeholder="Ej.: casa esquinera, portón negro"></textarea>
            </div>
            <button id="confirmar" type="submit" class="btn btn-primary btn-lg w-100" disabled>
              <i class="bi bi-bag-check me-1"></i>Confirmar pedido
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="tituloExito" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <div class="display-4 text-success mb-2"><i class="bi bi-check-circle-fill"></i></div>
        <h2 id="tituloExito" class="h4 fw-bold">¡Pedido registrado!</h2>
        <p class="text-secondary mb-1">Tu número de pedido es <strong id="numeroPedido"></strong></p>
        <p class="text-secondary">Total a pagar: <strong id="totalPedido"></strong></p>
        <div class="d-flex gap-2 justify-content-center mt-2">
          <a id="verPedidos" href="/pedidos.html" class="btn btn-primary">Ver mis pedidos</a>
          <a href="/" class="btn btn-outline-primary">Volver al catálogo</a>
        </div>
      </div>
    </div>
  </div>

  <div id="pie"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/carrito.js"></script>
</body>
</html>
