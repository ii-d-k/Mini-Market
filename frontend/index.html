<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · MiniMarket</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main>
    <section class="portada py-5 mb-4">
      <div class="container py-lg-3">
        <div class="row align-items-center g-4">
          <div class="col-lg-7">
            <span class="badge rounded-pill bg-light text-success mb-3 px-3 py-2">
              <i class="bi bi-truck me-1"></i> Entrega a domicilio
            </span>
            <h1 class="display-5 fw-bold mb-3">Tu mercado de barrio, ahora en línea</h1>
            <p class="lead opacity-75 mb-4">Elige tus productos, arma tu carrito y recibe tu pedido sin salir de casa.</p>
            <div class="input-group input-group-lg shadow-sm rounded-3 overflow-hidden">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input id="buscar" type="search" class="form-control" placeholder="Buscar arroz, café, leche…" aria-label="Buscar productos">
            </div>
          </div>
          <div class="col-lg-5 d-none d-lg-block text-center">
            <div style="font-size: 9rem; line-height: 1;">🛒</div>
          </div>
        </div>
      </div>
    </section>

    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
        <h2 class="h4 fw-bold mb-0">Productos</h2>
        <span id="conteo" class="text-secondary small"></span>
      </div>
      <div id="filtros" class="filtros mb-4" role="group" aria-label="Filtrar por categoría"></div>
      <div id="productos" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>
    </div>
  </main>

  <div id="pie"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/catalogo.js"></script>
</body>
</html>
