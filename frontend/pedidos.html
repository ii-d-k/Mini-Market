<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis pedidos · MiniMarket</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
</head>
<body>
  <header id="navbar"></header>

  <main class="container py-4 py-lg-5" style="max-width: 860px;">
    <h1 class="h3 fw-bold mb-2"><i class="bi bi-receipt text-success me-2"></i>Mis pedidos</h1>
    <p class="text-secondary mb-4">Escribe el email con el que hiciste tu compra para ver tus pedidos y su estado.</p>

    <form id="buscarPedidos" class="tarjeta p-3 mb-4">
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
        <input id="email" name="email" type="email" class="form-control" placeholder="tucorreo@ejemplo.com" required aria-label="Email">
        <button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Consultar</button>
      </div>
    </form>

    <div id="resultado"></div>
  </main>

  <div id="pie"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/pedidos.js"></script>
</body>
</html>
